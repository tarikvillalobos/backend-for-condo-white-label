services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U community -d community"]
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:8025:8025"
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: jdbc:postgresql://db:5432/community
      DATABASE_USER: community
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?Set API_ENCRYPTION_KEY}
      UPLOAD_DIRECTORY: /app/data/uploads
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_FROM: community@example.test
      SMTP_STARTTLS: "false"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
volumes:
  uploads:
  database:
