  /audit/events:
    post:
      operationId: reportAuditEvents
      tags:
      - Auditoria
      summary: Registrar eventos que só o cliente ou o equipamento observa
      description: 'Usado pelo app do morador, pela plataforma web e pelos equipamentos. NÃO substitui a captura
        do servidor: ações feitas pela API já são auditadas automaticamente. O autor vem do token, nunca do corpo;
        a origem fica marcada como client/device; occurredAt é guardado separado do horário de recebimento (diferença
        acima de 24 h → rejected clock_skew, exceto offline_action_synced). O servidor gera o id de cada registro
        (auditEntryId). Reenvios são descartados por impressão digital: mesmo remetente + type + occurredAt + target
        + durationSeconds + details → duplicate, sem gravar de novo. Por isso não há id do cliente nem Idempotency-Key
        nesta rota. Sempre 200, resultados na ordem do envio. Limite por ator e por minuto.'
      parameters:
      - $ref: '#/components/parameters/BrandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditClientEventBatch'
            examples:
              appMorador:
                summary: App do morador (SessionBearer)
                value:
                  events:
                  - type: app.camera_view_ended
                    occurredAt: '2026-09-26T12:04:10.482Z'
                    contextId: mem_7Qk2
                    target:
                      type: camera
                      id: cam_Garagem01
                    durationSeconds: 250
                  - type: app.screenshot_detected
                    occurredAt: '2026-09-26T12:05:00.117Z'
              catraca:
                summary: Catraca da garagem (DeviceKey)
                value:
                  events:
                  - type: device.door_forced
                    occurredAt: '2026-09-26T03:12:44.903Z'
                    target:
                      type: gate
                      id: gate_Garagem
                    details:
                      sensor: reed_2
              plataformaWeb:
                summary: Plataforma web (StaffBearer)
                value:
                  events:
                  - type: web.export_downloaded
                    occurredAt: '2026-09-26T14:20:00.356Z'
                    contextId: sa_Sindico_Jardins
                    target:
                      type: export
                      id: exp_4Hq9
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditClientEventAckList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      security:
      - SessionBearer: []
      - StaffBearer: []
      - DeviceKey: []
      x-audit:
        category: data_export
        action: reportAuditEvents
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
