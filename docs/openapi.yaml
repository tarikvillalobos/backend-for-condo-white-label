# OpenAPI contract for the implemented HTTP routes.
# Update this file when route methods, paths, or DTOs change.
openapi: "3.1.0"
info:
  title: "Community API"
  version: "0.1.0"
  description: "Kotlin/Ktor API for white-label condo and smart locker applications. IDs are opaque strings. Human sessions select a tenant at sign-in; branding never grants access. Protected operations enforce active membership, enabled features, action permissions, and resource ownership. ISO timestamps use an explicit UTC offset. JSON request bodies reject unknown properties. The request body limit is 3 MiB. Permissions listed in descriptions are additional to authentication. See docs/identity.md, docs/deliveries.md, docs/reservations.md, and docs/community.md for workflow rules."
servers:
  - {"url":"http://localhost:8080","description":"Local development"}
security:
  -
    SessionBearer: []
paths:
  "/health/live":
    get:
      tags: ["Health"]
      summary: "Check liveness"
      operationId: "get_health_live"
      security: []
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
        default: {"$ref":"#/components/responses/Error"}
  "/health/ready":
    get:
      tags: ["Health"]
      summary: "Check database readiness"
      operationId: "get_health_ready"
      security: []
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
        default: {"$ref":"#/components/responses/Error"}
        "503":
          description: "Database is not ready."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
  "/api/v1/auth/login":
    post:
      tags: ["Identity"]
      summary: "Sign in with a password"
      operationId: "post_api_v1_auth_login"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/refresh":
    post:
      tags: ["Identity"]
      summary: "Rotate access and refresh tokens"
      operationId: "post_api_v1_auth_refresh"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/RefreshRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/activate":
    post:
      tags: ["Identity"]
      summary: "Activate an invited account"
      operationId: "post_api_v1_auth_activate"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ActivationRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/recovery/request":
    post:
      tags: ["Identity"]
      summary: "Request password recovery"
      operationId: "post_api_v1_auth_recovery_request"
      description: "Requests are rate limited. Recovery and code request responses do not reveal whether the account exists."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/EmailRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/recovery/confirm":
    post:
      tags: ["Identity"]
      summary: "Reset password using a recovery token"
      operationId: "post_api_v1_auth_recovery_confirm"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ActivationRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/otp/request":
    post:
      tags: ["Identity"]
      summary: "Request an email sign-in code"
      operationId: "post_api_v1_auth_otp_request"
      description: "Requests are rate limited. Recovery and code request responses do not reveal whether the account exists."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/EmailRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/otp/confirm":
    post:
      tags: ["Identity"]
      summary: "Sign in with a one-time email code"
      operationId: "post_api_v1_auth_otp_confirm"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/OtpRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/logout":
    post:
      tags: ["Identity"]
      summary: "Revoke the current session"
      operationId: "post_api_v1_auth_logout"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me":
    get:
      tags: ["Identity"]
      summary: "Read your profile"
      operationId: "get_api_v1_me"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        default: {"$ref":"#/components/responses/Error"}
    patch:
      tags: ["Identity"]
      summary: "Update your display name"
      operationId: "patch_api_v1_me"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ProfileRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/verify":
    post:
      tags: ["Identity"]
      summary: "Verify your password for sensitive operations"
      operationId: "post_api_v1_me_verify"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VerificationRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/password":
    post:
      tags: ["Identity"]
      summary: "Change your password and revoke sessions"
      operationId: "post_api_v1_me_password"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/PasswordRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/contact/request":
    post:
      tags: ["Identity"]
      summary: "Request a verified email change"
      operationId: "post_api_v1_me_contact_request"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ContactRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/contact/confirm":
    post:
      tags: ["Identity"]
      summary: "Confirm your email change and revoke sessions"
      operationId: "post_api_v1_me_contact_confirm"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ContactConfirmation"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/sessions":
    get:
      tags: ["Identity"]
      summary: "List active sessions"
      operationId: "get_api_v1_me_sessions"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref":"#/components/schemas/SessionView"}
        default: {"$ref":"#/components/responses/Error"}
    delete:
      tags: ["Identity"]
      summary: "Revoke all your sessions"
      operationId: "delete_api_v1_me_sessions"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/sessions/{id}":
    delete:
      tags: ["Identity"]
      summary: "Revoke one of your sessions"
      operationId: "delete_api_v1_me_sessions_id"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Resource identifier."
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/configuration":
    get:
      tags: ["Platform"]
      summary: "Read client, brand, and active membership configuration"
      operationId: "get_api_v1_configuration"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Configuration"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/client":
    put:
      tags: ["Platform"]
      summary: "Update client configuration"
      operationId: "put_api_v1_client"
      description: "Required permission: client.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ClientSettings"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/ClientSettingsRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/brands":
    get:
      tags: ["Platform"]
      summary: "List client brands"
      operationId: "get_api_v1_brands"
      parameters:
        - {"$ref":"#/components/parameters/Offset"}
        - {"$ref":"#/components/parameters/Limit"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/BrandRecordPage"}
        default: {"$ref":"#/components/responses/Error"}
    post:
      tags: ["Platform"]
      summary: "Create a white-label brand"
      operationId: "post_api_v1_brands"
      description: "Required permission: brands.manage."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/Brand"}
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/BrandRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/brands/{id}":
    put:
      tags: ["Platform"]
      summary: "Update a white-label brand"
      operationId: "put_api_v1_brands_id"
      description: "Required permission: brands.manage."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Resource identifier."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/Brand"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/BrandRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/roles":
    get:
      tags: ["Platform"]
      summary: "List role templates and custom roles"
      operationId: "get_api_v1_roles"
      description: "Required permission: roles.manage."
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref":"#/components/schemas/RoleDefinition"}
        default: {"$ref":"#/components/responses/Error"}
    post:
      tags: ["Platform"]
      summary: "Create a custom role"
      operationId: "post_api_v1_roles"
      description: "Permissions cannot exceed the caller delegated authority. Built-in templates cannot be replaced. Required permission: roles.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/RoleDefinition"}
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/RoleDefinitionRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/roles/{id}":
    put:
      tags: ["Platform"]
      summary: "Update a custom role"
      operationId: "put_api_v1_roles_id"
      description: "Permissions cannot exceed the caller delegated authority. Built-in templates cannot be replaced. Required permission: roles.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Resource identifier."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/RoleDefinition"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/RoleDefinitionRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/accounts":
    get:
      tags: ["Platform"]
      summary: "List account summaries"
      operationId: "get_api_v1_accounts"
      description: "Required permission: accounts.manage."
      parameters:
        - {"$ref":"#/components/parameters/Offset"}
        - {"$ref":"#/components/parameters/Limit"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/AccountSummaryPage"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/accounts/{id}/state":
    put:
      tags: ["Platform"]
      summary: "Activate or deactivate an account"
      operationId: "put_api_v1_accounts_id_state"
      description: "Required permission: accounts.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Resource identifier."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/AccountState"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/AccountSummary"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/memberships":
    get:
      tags: ["Platform"]
      summary: "List memberships in the selected scope"
      operationId: "get_api_v1_memberships"
      description: "Required permission: memberships.read."
      parameters:
        - {"$ref":"#/components/parameters/Offset"}
        - {"$ref":"#/components/parameters/Limit"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/MembershipRecordPage"}
        default: {"$ref":"#/components/responses/Error"}
    post:
      tags: ["Platform"]
      summary: "Create an authorized membership"
      operationId: "post_api_v1_memberships"
      description: "Required permission: memberships.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/Membership"}
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/MembershipRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/memberships/{id}":
    put:
      tags: ["Platform"]
      summary: "Update or revoke a membership"
      operationId: "put_api_v1_memberships_id"
      description: "Required permission: memberships.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Resource identifier."
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/Membership"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/MembershipRecord"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/invitations":
    post:
      tags: ["Platform"]
      summary: "Invite an account and create its membership"
      operationId: "post_api_v1_invitations"
      description: "Activation credential is returned once. A repeated idempotency key returns 409. locationId in the body must equal the selected location; use null and role client_admin for client scope. Required permission: memberships.manage. Requires password verification within the last 10 minutes; use POST /api/v1/me/verify when verification_required is returned."
      parameters:
        - {"$ref":"#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/InvitationRequest"}
      responses:
        "201":
          description: "Created."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/InvitationIssue"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/locations/{locationId}/memberships":
    get:
      tags: ["Platform"]
      summary: "List memberships in the selected scope"
      operationId: "get_api_v1_locations_locationId_memberships"
      description: "Required permission: memberships.read."
      parameters:
        -
          name: "locationId"
          in: "path"
          required: true
          schema: {"type":"string"}
          description: "Selected location ID."
