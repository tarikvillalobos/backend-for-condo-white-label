components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token opaco retornado por login/refresh; transportar somente por HTTPS.
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token de sessão de membro da equipe (porteiro, síndico, administradora). Papel verificado por
        operação.
    DeviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Chave secreta por dispositivo (locker, catraca, leitor). Rotacionável; nunca embarcada em app
        de usuário.
  parameters:
    BrandId:
      name: X-Brand-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: Identificador público da distribuição. Deve corresponder à marca da sessão/desafio.
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ParcelId:
      name: parcelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID aleatória por instalação; não usar identificador de hardware ou publicidade.
    InstallationKey:
      name: X-Installation-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
      description: 'Segredo aleatório de 32 bytes (base64url sem padding) por instalação/marca, gerado por CSPRNG
        e guardado no

        cofre. Primeiro registro vincula seu hash à instalação; todo PUT/DELETE posterior exige a mesma prova de

        posse. Logout remove destinatário/token push, mas não permite sobrescrever essa prova só por conhecer

        installationId. Nunca registrar esta chave em logs ou utilizá-la como autenticação da conta.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID por intenção, preservada somente ao repetir uma operação de resultado incerto. Ver regras
        gerais.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: ETag forte da versão consultada, como "3". Previne aplicação sobre estado alterado; conflito
        retorna 412.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Omitir na primeira página. Reutilizar os demais parâmetros do snapshot.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ParcelFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
        - all
        - waiting
        - collected
        default: all
      description: collected inclui manual e físico, sempre distinguíveis no status de cada item.
    Since:
      name: since
      in: query
      schema:
        $ref: '#/components/schemas/Instant'
      description: Início inclusivo. Informar junto de until; se ambos omitidos, últimos 30 dias pelo relógio do
        servidor.
    Until:
      name: until
      in: query
      schema:
        $ref: '#/components/schemas/Instant'
      description: Fim exclusivo. Exige since < until, até o instante atual e intervalo máximo de 366 dias.
