      required: false
      schema:
        type: string
        enum:
        - success
        - denied
        - failed
      description: ''
    AuditSeverity:
      name: severity
      in: query
      required: false
      schema:
        type: string
        enum:
        - info
        - notice
        - warning
        - critical
      description: Mínima.
    AuditActorFilter:
      name: actorUserId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Identifier'
      description: Tudo o que uma pessoa fez.
    AuditTargetType:
      name: targetType
      in: query
      required: false
      schema:
        type: string
      description: 'Ex.: parcel, membership, camera, node.'
    AuditTargetId:
      name: targetId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Identifier'
      description: Histórico completo de um objeto.
    AuditEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
      description: ''
    OperationFilter:
      name: operationId
      in: query
      required: false
      schema:
        type: string
      description: 'Ex.: residentManualPickup, adminUpdateCamera, deleteNode.'
    RequestOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum:
        - success
        - denied
        - failed
        - error
      description: ''
    ChangeTable:
      name: table
      in: query
      required: false
      schema:
        type: string
      description: Tabela do banco.
    OutsideApi:
      name: outsideApi
      in: query
      required: false
      schema:
        type: boolean
      description: true = só alterações feitas direto no banco (sem requestId).
    TraceRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
      description: ''
    HistoryTargetType:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum:
        - parcel
        - membership
        - user
        - node
        - camera
        - locker
        - compartment
        - device
        - access_invite
        - arrival
        - reservation
        - space
        - pet
        - vehicle
        - ticket
        - announcement
        - staff_assignment
        - organization
      description: ''
    HistoryTargetId:
      name: targetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    OwnSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    ContractorId:
      name: contractorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    DelegateMembershipId:
      name: delegateMembershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
      description: ''
    WorkOrderStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - scheduled
        - in_progress
        - waiting_parts
        - completed
        - cancelled
      description: ''
    PendingOnly:
      name: pending
      in: query
      required: false
      schema:
        type: boolean
      description: true = só quem ainda não leu/confirmou.
    DocumentCategory:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum:
        - rules
        - minutes
        - financial
        - notice
        - form
        - contract
        - other
      description: ''
    IncidentOnly:
      name: incident
      in: query
      required: false
      schema:
        type: boolean
      description: Só ocorrências.
  headers:
    RequestId:
      description: Identificador de correlação não sensível.
      schema:
        type: string
        maxLength: 128
    NoStore:
      description: Proíbe armazenamento HTTP de dados pessoais ou credenciais.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Segundos mínimos até a próxima tentativa; presente em 429 e operações em andamento.
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Versão forte da encomenda para If-Match.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Problem:
      description: Erro estruturado seguro; status HTTP e code determinam a ação permitida.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sessão ausente/expirada/revogada ou refresh inválido. Reautenticar quando a renovação falhar.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Desafio Bearer sem dados pessoais.
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Identificador opaco. O app não extrai dados pessoais nem autorização deste valor.
    Instant:
      type: string
      format: date-time
      pattern: Z$
      examples:
      - '2026-09-26T12:00:00.000Z'
      description: Instante RFC 3339 em UTC; resolução mínima de milissegundos quando disponível.
    Secret:
      type: string
      minLength: 1
      maxLength: 8192
      description: 'Segredo: não registrar em logs, métricas, URLs ou cache não seguro.'
    Challenge:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        expiresAt:
          $ref: '#/components/schemas/Instant'
        resendAt:
          $ref: '#/components/schemas/Instant'
        channel:
          type: string
          enum:
          - sms
          - email
        maskedDestination:
          type: string
          maxLength: 254
        codeLength:
          type: integer
          const: 6
        purpose:
          type: string
          enum:
          - login
          - contact_change
          - password_recovery
          - staff_mfa
          - step_up
      required:
      - id
      - expiresAt
      - resendAt
      - channel
      - maskedDestination
      - codeLength
      - purpose
      description: Expiração e reenvio são definidos pelo servidor. Novo envio invalida o OTP anterior. Não devolver
        o OTP.
      examples:
      - id: challenge-example
        expiresAt: '2026-09-26T12:05:00.000Z'
        resendAt: '2026-09-26T12:00:30.000Z'
        channel: sms
        maskedDestination: +55 ** *****-4321
        codeLength: 6
        purpose: login
    LoginRequest:
      type: object
      properties:
        contact:
          type: string
          minLength: 3
          maxLength: 254
          description: Celular brasileiro em E.164 (+55...) para sms, endereço de e-mail para email.
        cpf:
          type: string
          pattern: ^(?!([0-9])\1{10})[0-9]{11}$
          description: Somente os onze dígitos; validar dígitos verificadores. Nunca usar como segredo.
        channel:
          type: string
          enum:
          - sms
          - email
      required:
      - contact
      - cpf
      - channel
      additionalProperties: false
      allOf:
      - if:
          properties:
            channel:
              const: sms
        then:
          properties:
            contact:
              pattern: ^\+55[1-9][0-9]9[0-9]{8}$
        else:
          properties:
            contact:
              format: email
              pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
      examples:
      - contact: '+5511987654321'
        cpf: '52998224725'
        channel: sms
      - contact: ana@example.test
        cpf: '52998224725'
        channel: email
    OtpVerification:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
          description: OTP recebido pelo canal escolhido.
      required:
      - code
      additionalProperties: false
    SessionTokens:
      type: object
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          $ref: '#/components/schemas/Secret'
        accessExpiresAt:
          $ref: '#/components/schemas/Instant'
        refreshToken:
          $ref: '#/components/schemas/Secret'
        refreshExpiresAt:
          $ref: '#/components/schemas/Instant'
        userId:
          $ref: '#/components/schemas/Identifier'
        brandId:
          $ref: '#/components/schemas/Identifier'
        sessionId:
          $ref: '#/components/schemas/Identifier'
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        staff:
          type: boolean
          description: true = sessão de equipe (StaffBearer). Só após MFA quando a atribuição exige.
        mfaChallenge:
          anyOf:
          - $ref: '#/components/schemas/Challenge'
          - type: 'null'
          description: 'Presente quando a conta tem atribuição de equipe com MFA: tokens vêm limitados a escopo
            de morador até verificar.'
      required:
      - tokenType
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      - userId
      - brandId
      - sessionId
      - permissions
      description: Guardar tokens somente no cofre nativo. permissions são informativas; o servidor autoriza cada
        operação.
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          $ref: '#/components/schemas/Secret'
      required:
      - refreshToken
      additionalProperties: false
    ChannelCapability:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
      required:
      - available
      description: Disponibilidade do fornecedor/backend, independente de preferência e permissão do sistema.
    Features:
      type: object
      properties:
        manualPickup:
          type: boolean
        undoManualPickup:
          type: boolean
        contactEditing:
          type: boolean
        recipients:
          type: boolean
        supportIssues:
          type: boolean
        pushRegistration:
          type: boolean
      required:
      - manualPickup
      - undoManualPickup
      - contactEditing
      - recipients
      - supportIssues
      - pushRegistration
    Capabilities:
      type: object
      properties:
        features:
          $ref: '#/components/schemas/Features'
        channels:
          type: object
          properties:
            inApp:
              $ref: '#/components/schemas/ChannelCapability'
            sms:
              $ref: '#/components/schemas/ChannelCapability'
            email:
              $ref: '#/components/schemas/ChannelCapability'
            whatsapp:
              $ref: '#/components/schemas/ChannelCapability'
            push:
              $ref: '#/components/schemas/ChannelCapability'
          required:
          - inApp
          - sms
          - email
          - whatsapp
          - push
      required:
      - features
      - channels
    BrandConfiguration:
      type: object
      properties:
        brandId:
          $ref: '#/components/schemas/Identifier'
        appName:
          type: string
          minLength: 1
          maxLength: 100
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        supportEmail:
          type:
          - string
          - 'null'
          format: email
        termsUrl:
          type:
          - string
          - 'null'
          format: uri
          pattern: ^https://
        privacyUrl:
          type:
          - string
          - 'null'
          format: uri
          pattern: ^https://
        modules:
          $ref: '#/components/schemas/Modules'
        authMethods:
          type: array
          items:
            type: string
            enum:
            - otp
            - password
            - invitation
        support:
          $ref: '#/components/schemas/SupportContacts'
      required:
      - brandId
      - appName
      - capabilities
      - supportEmail
      - termsUrl
      - privacyUrl
      description: Complementa a marca embarcada. Não muda identificador nativo nem autoriza acesso a qualquer vínculo.
    Membership:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        locationId:
          $ref: '#/components/schemas/Identifier'
        locationName:
          type: string
          maxLength: 200
        unitId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        unitLabel:
          type:
          - string
          - 'null'
          maxLength: 200
        timeZone:
          type: string
          examples:
          - America/Sao_Paulo
          maxLength: 100
          description: Identificador IANA do local.
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        condominiumId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
          description: Nulo para locker avulso.
        condominiumName:
          type:
          - string
          - 'null'
        blockLabel:
          type:
          - string
          - 'null'
          description: Bloco/torre, quando houver.
        role:
          type: string
          enum:
          - resident
          - owner
          - tenant
          - dependent
          - locker_user
          description: Papel do usuário no vínculo.
        nodeId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
          description: Nó da árvore onde o vínculo está (unidade, sala, torre, raiz…). O vínculo cobre toda a subárvore.
            unitId/unitLabel são o mesmo nó, mantidos por compatibilidade.
        nodePath:
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          description: Ancestrais da raiz até o nó, para breadcrumb.
        modules:
          $ref: '#/components/schemas/Modules'
        permissions:
          type: array
          items:
            type: string
          description: Permissões efetivas neste vínculo (x-required-permission).
      required:
      - id
      - locationId
      - locationName
      - unitId
      - unitLabel
      - timeZone
      - capabilities
      allOf:
      - if:
          properties:
            unitId:
              type: 'null'
        then:
          properties:
            unitLabel:
              type: 'null'
        else:
          properties:
            unitLabel:
              type: string
      description: Vínculo do usuário com um condomínio/unidade ou com um locker avulso. Campos novos são opcionais
        para compatibilidade com o SmartLocker 0.1.0.
    MembershipList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - items
      description: Lista completa dos vínculos atualmente autorizados.
    CommunicationPreferences:
      type: object
      properties:
        inApp:
          type: boolean
        sms:
          type: boolean
        whatsapp:
          type: boolean
      required:
      - inApp
      - sms
      - whatsapp
      description: Preferências do usuário. Não atestam permissão do sistema, registro push ou disponibilidade do
        fornecedor.
    PreferencesUpdate:
      type: object
      properties:
        inApp:
          type: boolean
        sms:
          type: boolean
        whatsapp:
          type: boolean
      additionalProperties: false
      minProperties: 1
    Profile:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9][0-9]{7,14}$
        phoneVerifiedAt:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        emailVerifiedAt:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        preferences:
          $ref: '#/components/schemas/CommunicationPreferences'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        staffAssignments:
          type: array
          items:
            $ref: '#/components/schemas/StaffAssignment'
          description: Vazio para morador comum.
      required:
      - id
      - name
      - phone
      - phoneVerifiedAt
      - email
      - emailVerifiedAt
      - preferences
      - memberships
    ContactChangeRequest:
      type: object
      properties:
        contact:
          type: string
          minLength: 3
          maxLength: 254
          description: 'Novo contato normalizado: E.164 para sms ou e-mail válido para email.'
        channel:
          type: string
          enum:
          - sms
          - email
      required:
      - contact
      - channel
      additionalProperties: false
      allOf:
      - if:
          properties:
            channel:
              const: sms
        then:
          properties:
            contact:
              pattern: ^\+55[1-9][0-9]9[0-9]{8}$
        else:
          properties:
            contact:
              format: email
              pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
      examples:
      - contact: new@example.test
        channel: email
    Recipient:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 200
        relationship:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
          - person
          - node
      required:
      - id
      - name
      - relationship
      description: Destinatário visível conforme autorização explícita. Sua presença não concede acesso às encomendas
        dele.
    RecipientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
      required:
      - items
    Locker:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 500
        available:
          type: boolean
      required:
      - id
      - name
      - address
      - available
    ParcelActions:
      type: object
      properties:
        canMarkManually:
          type: boolean
        canUndoManual:
          type: boolean
        undoUntil:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        canReportIssue:
          type: boolean
      required:
      - canMarkManually
      - canUndoManual
      - undoUntil
      - canReportIssue
      description: Decisão do servidor válida no instante da resposta. O servidor revalida cada comando.
    TimelineEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - deposited
          - notification_available
          - manual_pickup
          - manual_pickup_reverted
          - physical_pickup
        at:
          $ref: '#/components/schemas/Instant'
      required:
      - type
      - at
    Parcel:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        recipientId:
          $ref: '#/components/schemas/Identifier'
        membershipId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        carrier:
          type: string
          minLength: 1
          maxLength: 200
        tracking:
          type:
          - string
          - 'null'
          maxLength: 200
        status:
          type: string
          enum:
          - waiting
          - manual
          - collected
        locker:
          anyOf:
          - $ref: '#/components/schemas/Locker'
          - type: 'null'
        compartment:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
        size:
          type:
          - string
          - 'null'
          maxLength: 50
        depositedAt:
          $ref: '#/components/schemas/Instant'
        notifiedAt:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        deadline:
          $ref: '#/components/schemas/Instant'
        manualAt:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        collectedAt:
          anyOf:
          - $ref: '#/components/schemas/Instant'
          - type: 'null'
        credentialStatus:
          type: string
          enum:
          - active
          - expired
          - revoked
          - consumed
          - unverified
        actions:
          $ref: '#/components/schemas/ParcelActions'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        version:
          type: integer
          minimum: 1
        recipientKind:
          type: string
          enum:
          - membership
          - node
          description: node = destinatário é o nó (sala/loja); recipientId então é o id do nó e aparece em /recipients
            com relationship="node".
        node:
          anyOf:
          - $ref: '#/components/schemas/NodeRef'
          - type: 'null'
        delegates:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
          description: Pessoas autorizadas pelo destinatário a retirar esta encomenda.
        collectedBy:
          anyOf:
          - $ref: '#/components/schemas/PersonRef'
          - type: 'null'
          description: Quem retirou de fato (confirmado pelo locker ou pela portaria).
        storage:
          type: string
          enum:
          - front_desk
          - locker
      required:
      - id
      - recipientId
      - membershipId
      - carrier
      - tracking
      - status
      - locker
      - compartment
      - size
      - depositedAt
      - notifiedAt
      - deadline
      - manualAt
      - collectedAt
      - credentialStatus
      - actions
      - timeline
      - version
      - storage
      description: 'collected exige collectedAt de evento físico confiável; manual exige manualAt e collectedAt
        nulo. waiting

        possui ambos nulos. Credencial nunca aparece nesta representação. Prazo vencido não implica retirada.'
      allOf:
      - if:
          properties:
            status:
              const: waiting
        then:
          properties:
            manualAt:
              type: 'null'
            collectedAt:
              type: 'null'
      - if:
          properties:
            status:
              const: manual
        then:
          properties:
            manualAt:
              $ref: '#/components/schemas/Instant'
            collectedAt:
              type: 'null'
            credentialStatus:
              const: revoked
      - if:
          properties:
            status:
              const: collected
        then:
          properties:
            collectedAt:
              $ref: '#/components/schemas/Instant'
            credentialStatus:
              const: consumed
    PageInfo:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 2048
        snapshotAt:
          $ref: '#/components/schemas/Instant'
        snapshotExpiresAt:
          $ref: '#/components/schemas/Instant'
      required:
      - nextCursor
      - snapshotAt
      - snapshotExpiresAt
      description: 'Cursor opaco vinculado ao usuário, marca, vínculo, filtro, ordenação e snapshot. Uma página
        não é um total

        global. Cursor expirado retorna 410 CURSOR_EXPIRED; reiniciar a primeira página.'
    ParcelPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Parcel'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - pageInfo
    ParcelMetrics:
      type: object
      properties:
        since:
          $ref: '#/components/schemas/Instant'
        until:
          $ref: '#/components/schemas/Instant'
        generatedAt:
          $ref: '#/components/schemas/Instant'
        complete:
          type: boolean
        totalReceived:
          type:
          - integer
          - 'null'
          minimum: 0
        physicalPickupCount:
          type:
          - integer
          - 'null'
          minimum: 0
        averagePickupDurationSeconds:
          type:
          - number
          - 'null'
          minimum: 0
      required:
      - since
      - until
      - generatedAt
      - complete
      - totalReceived
      - physicalPickupCount
      - averagePickupDurationSeconds
      description: 'Período por depositedAt, inclusivo em since e exclusivo em until. Total de encomendas autorizadas
        no vínculo.

        Média aritmética collectedAt-depositedAt apenas para retiradas físicas válidas até until, excluindo manuais.

        Sem retiradas físicas: contagem zero e média null. complete=false exige todas as métricas null. Indicadores

        independem do filtro e das páginas da listagem.'
      allOf:
      - if:
          properties:
            complete:
              const: false
        then:
          properties:
            totalReceived:
              type: 'null'
            physicalPickupCount:
              type: 'null'
            averagePickupDurationSeconds:
              type: 'null'
        else:
          properties:
            totalReceived:
              type: integer
            physicalPickupCount:
              type: integer
      - if:
          properties:
            physicalPickupCount:
              const: 0
        then:
          properties:
            averagePickupDurationSeconds:
              type: 'null'
      examples:
      - since: '2026-08-27T12:00:00.000Z'
        until: '2026-09-26T12:00:00.000Z'
        generatedAt: '2026-09-26T12:00:00.000Z'
        complete: true
        totalReceived: 8
        physicalPickupCount: 6
        averagePickupDurationSeconds: 9900
