openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Condo Platform API
  version: 1.1.0-draft
  summary: API unificada para condo-app (moradores) e smartlocker-app (usuários de locker).
  description: "Contrato unificado (junção do contrato de plataforma com o contrato Kotlin/Ktor \"Community API\"\
    \ 0.1.0) para os aplicativos condo-app e smartlocker-app e para a camada operacional\n(lockers, portaria, câmeras,\
    \ administração).\n\nCOMPATIBILIDADE: os 23 caminhos do contrato SmartLocker 0.1.0-draft são mantidos byte a\
    \ byte em forma e\nsemântica; campos novos são sempre opcionais. Um cliente SmartLocker existente continua funcionando.\n\
    \nESCOPO E ISOLAMENTO: toda operação é isolada por marca (X-Brand-Id), usuário, condomínio, unidade e\nvínculo\
    \ (membership). Conhecer um ID não autoriza acesso; recurso alheio responde 404.\nUm vínculo (Membership) representa\
    \ o usuário dentro de um condomínio/unidade OU de um locker avulso.\nOs módulos habilitados por marca e por\
    \ condomínio chegam em Membership.modules e BrandConfiguration.modules.\n\nAUTENTICAÇÃO: bearer opaco. Dois\
    \ caminhos de login coexistem: OTP (SmartLocker) e senha (condo-app),\nalém de primeiro acesso por convite.\
    \ Refresh é rotativo. Perfis operacionais (portaria, locker, admin)\nusam schemes próprios: DeviceKey (hardware)\
    \ e StaffBearer (equipe).\n\nCONVENÇÕES: IDs opacos; datas RFC 3339 UTC com Z; paginação por cursor com snapshot\
    \ estável (410 ao\nexpirar); erros em application/problem+json com código estável; mutações relevantes exigem\n\
    Idempotency-Key (UUID, retenção 24h); concorrência por If-Match/version onde indicado.\nRespostas pessoais usam\
    \ Cache-Control: no-store.\n\nHARDWARE: o app do usuário nunca abre porta nem declara retirada física. Eventos\
    \ físicos entram apenas\npela área /ops autenticada por DeviceKey e são reconciliados no servidor (dedupe por\
    \ eventId,\ntolerância a eventos fora de ordem via occurredAt).\n\nAUDITORIA (obrigatória, não opt-in). Toda\
    \ requisição é registrada; x-audit.layers diz o que mais cada operação gera:\n  request — api_requests: quem\
    \ (usuário, papel, vínculo ou atribuição, organização, em nome de quem), operação, rota, ids, resultado, duração.\
    \ TODAS as operações, inclusive leituras, 401/403/404/409/5xx.\n  event   — audit_log: evento de negócio com\
    \ significado e antes/depois, hash encadeado. Toda escrita e leituras sensíveis.\n  changes — audit_changes:\
    \ cada linha inserida/alterada/removida no banco, por trigger nas tabelas de negócio, inclusive cascatas; tabelas\
    \ técnicas de auditoria, segredos e controle são excluídas para evitar recursão e exposição\n            e alterações\
    \ feitas fora da API (registradas como actor_kind=database).\nAs três camadas compartilham o X-Request-Id devolvido\
    \ em toda resposta. Registros de negócio usam exclusão lógica. Segredos temporários, sessões expiradas e arquivos\
    \ temporários podem ser expurgados; pedidos de privacidade seguem política de anonimização e retenção.\nSegredos,\
    \ códigos, tokens e documentos nunca aparecem em claro em nenhuma camada.\n\nPERMISSÕES: formato dominio.acao[.escopo].\
    \ .own = só os próprios registros; .all = todo o escopo do contexto. Catálogo completo em x-permission-catalog\
    \ e GET /admin/permissions.\nCONFIRMAÇÃO DE IDENTIDADE: operações com x-step-up exigem POST /me/verify nos últimos\
    \ 10 minutos (403 VERIFICATION_REQUIRED).\nPROVEDORES: câmera ao vivo, gravação e abertura remota de compartimento\
    \ respondem 501 PROVIDER_NOT_CONFIGURED sem provedor; nada é simulado.\nENCOMENDAS: \"já retirei\" do morador\
    \ é relato (status manual); só o evento do locker ou a confirmação no balcão finalizam (collected).\n\nMARCA\
    \ E CLIENTE: X-Brand-Id identifica uma distribuição pertencente a um cliente (tenant). O servidor resolve esse\
    \ vínculo e vincula cada sessão à marca. A marca não concede acesso. SessionBearer e StaffBearer usam o mesmo\
    \ mecanismo de sessão humana; StaffBearer exige atribuição de equipe ativa. A compatibilidade com clientes legados\
    \ deve ser validada pelos testes de contrato."
  license:
    name: Privado e proprietário
servers:
- url: http://localhost:8080/v1
  description: Desenvolvimento local via Docker Compose
security:
- SessionBearer: []
tags:
- name: Configuration
  description: Capacidades públicas da distribuição white-label.
- name: Authentication
  description: OTP, senha, recuperação, convites de primeiro acesso, refresh e logout.
- name: Profile
  description: Identidade, vínculos, preferências, contatos, privacidade.
- name: Condominium
  description: Contexto do condomínio, unidade, moradores e veículos.
- name: Parcels
  description: Encomendas, métricas, credencial de retirada, marcação manual.
- name: Cameras
  description: Câmeras autorizadas, sessões de vídeo ao vivo e gravações.
- name: Access
  description: Visitantes, prestadores e convites de acesso com validade.
- name: Pets
  description: Pets, vacinação e alertas de perdidos/encontrados.
- name: Reservations
  description: Espaços comuns, disponibilidade, reservas e agenda.
- name: Notifications
  description: Avisos de entrega (SmartLocker), comunicados e caixa de entrada.
- name: Support
  description: Relatos de encomenda, solicitações e ocorrências.
- name: Devices
  description: Registro do CELULAR do morador para push. Não é hardware (ver Hardware).
- name: Uploads
  description: URL pré-assinada para fotos, anexos e planilhas (morador e equipe).
- name: Portaria
  description: 'Operação do dia a dia na portaria (StaffBearer: porter/manager) e catracas (DeviceKey).'
- name: Hardware
  description: Lockers e leitores físicos (DeviceKey). Sem usuário humano.
- name: Admin · Organizações
  description: 'Administradoras e portarias remotas: condomínios atendidos, operadores, papéis customizados, fila
    de trabalho.'
- name: Admin · Condomínios
  description: Criar e configurar condomínios; carteira da administradora.
- name: Admin · Estrutura
  description: 'Árvore de recursos: tipos de nó, blocos, alas, unidades, salas; ficha do nó.'
- name: Admin · Pessoas
  description: 'Moradores: cadastro, importação, convites, suspensão, mudança de unidade.'
- name: Admin · Equipe e papéis
  description: Síndico, porteiros, suporte; catálogo de permissões.
- name: Admin · Encomendas
  description: Encomendas por condomínio/bloco/apartamento; corrigir, prorrogar, devolver.
- name: Admin · Acesso
  description: Visitantes, convites, histórico de entradas, portões.
- name: Admin · Reservas
  description: Espaços, regras, bloqueios, aprovação de reservas, agenda.
- name: Admin · Câmeras
  description: Cadastro, quem pode ver, auditoria de visualização.
- name: Admin · Lockers e equipamentos
  description: Lockers, compartimentos, equipamentos e suas chaves.
- name: Admin · Pets e veículos
  description: Consulta por nó, moderação de alertas, busca por placa.
- name: Admin · Comunicação
  description: Comunicados com taxa de leitura.
- name: Admin · Chamados
  description: Solicitações, ocorrências e relatos; comentários internos.
- name: Admin · Relatórios
  description: Painel, séries para gráficos, exportação, auditoria.
- name: Admin · Integrações
  description: Webhooks para ERP/BI.
- name: Documents
  description: Regimento, atas, formulários; ciência por revisão.
- name: Contacts
  description: Telefones úteis do condomínio.
- name: Admin · Documentos e contatos
  description: Publicar documentos e revisões, acompanhar ciência, manter contatos.
- name: Admin · Manutenção
  description: Prestadores, equipamentos com inspeção, ordens de serviço com evidência.
- name: Admin · Plataforma
  description: Configuração da marca, contas e catálogo de permissões (brand_admin).
- name: Health
  description: Sondas de infraestrutura. Sem autenticação e fora da auditoria.
- name: Auditoria
  description: 'Serviço transversal. CAPTURA: toda requisição de todos os atores (morador, equipe, portaria remota,
    equipamentos, jobs) e toda alteração no banco, automaticamente. CONSULTA: só administração, no próprio escopo
    (síndico → condomínio; organização → condomínios atendidos; marca → tudo). Morador nunca consulta auditoria.'
paths:
  /configuration:
    get:
      operationId: getBrandConfiguration
      tags:
      - Configuration
      summary: Consultar capacidades públicas da marca
      security: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandConfiguration'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: system
        action: getBrandConfiguration
        severity: info
        layers:
        - request
        logsDenied: true
  /auth/challenges:
    post:
      operationId: requestLoginChallenge
      tags:
      - Authentication
      summary: Solicitar código de login
      description: 'Sempre responder de forma equivalente para contas existentes e inexistentes. A aceitação não
        confirma entrega

        do canal. Aplicar limites por contato, CPF, marca e origem. CPF nunca autentica sozinho.'
      security: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: auth
        action: requestLoginChallenge
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /auth/challenges/{challengeId}/resend:
    parameters:
    - $ref: '#/components/parameters/ChallengeId'
    post:
      operationId: resendLoginChallenge
      tags:
      - Authentication
      summary: Reenviar código de login
      description: 'Respeitar resendAt. O servidor reenviará ao contato original; retorna novo desafio e invalida
        o anterior.

        Reenviar não remove limites globais contra abuso.'
      security: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: auth
        action: resendLoginChallenge
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /auth/challenges/{challengeId}/verify:
    parameters:
    - $ref: '#/components/parameters/ChallengeId'
    post:
      operationId: verifyLoginChallenge
      tags:
      - Authentication
      summary: Verificar OTP e criar sessão
      description: 'Consome o desafio de login uma única vez. Código incorreto retorna 422; expirado 410; tentativas
        esgotadas

        429. Mesma chave reproduz a sessão original por idempotência.'
      security: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: auth
        action: verifyLoginChallenge
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Authentication
      summary: Renovar e rotacionar a sessão
      description: 'Rotacionar refresh token a cada sucesso. A sessão e a marca devem corresponder ao token. O cliente
        serializa

        renovações; reuso com chave diferente após consumo revoga a família e retorna 401 REFRESH_REVOKED. Mesma
        chave

        e corpo reproduzem a mesma rotação durante a janela de idempotência, sem revogar a família.'
      security: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: auth
        action: refreshSession
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Authentication
      summary: Revogar a sessão atual
      description: 'Revogar access/refresh tokens da sessão e seus registros push. Limpar dados locais mesmo se
        a rede falhar; a

        confirmação da revogação remota só ocorre com resposta 204. Repetição com a mesma chave após revogação mantém

        204.'
      x-required-permission: sessions.manage
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: auth
        action: logoutSession
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /me:
    get:
      operationId: getProfile
      tags:
      - Profile
      summary: Consultar perfil e vínculos autorizados
      x-required-permission: profile.read
      parameters:
      - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: privacy
        action: getProfile
        severity: info
        layers:
        - request
        logsDenied: true
  /me/memberships:
    get:
      operationId: listMemberships
      tags:
      - Profile
      summary: Listar locais e unidades autorizados
      x-required-permission: profile.read
      parameters:
      - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: privacy
        action: listMemberships
        severity: info
        layers:
        - request
        logsDenied: true
  /me/preferences:
    patch:
      operationId: updateCommunicationPreferences
      tags:
      - Profile
      summary: Atualizar preferências de comunicação
      description: Aplicar apenas campos enviados. Uma preferência não habilita um canal indisponível nem concede
        permissão do sistema.
      x-required-permission: profile.manage
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: privacy
        action: updateCommunicationPreferences
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /me/contact-challenges:
    post:
      operationId: requestContactChange
      tags:
      - Profile
      summary: Verificar novo contato antes de alterar o perfil
      description: 'Exige sessão ativa e capacidade contactEditing. Enviar OTP ao novo contato; manter o atual até
        a verificação.

        Desafio vinculado à sessão, usuário, marca, canal e novo contato; não pode ser usado para login.'
      x-required-permission: profile.manage
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactChangeRequest'
      responses:
        '202':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: privacy
        action: requestContactChange
        severity: notice
        layers:
        - request
        - event
        - changes
        logsDenied: true
  /me/contact-challenges/{challengeId}/resend:
    parameters:
    - $ref: '#/components/parameters/ChallengeId'
    post:
      operationId: resendContactChange
      tags:
      - Profile
      summary: Reenviar OTP para o novo contato
      description: 'Usar o contato e canal armazenados no desafio, nunca inferir pelo estado local da tela. Retornar
        novo desafio

        invalidando o anterior; respeitar resendAt.'
      x-required-permission: profile.manage
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Resultado confirmado pelo servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-audit:
        category: privacy
        action: resendContactChange
        severity: notice
