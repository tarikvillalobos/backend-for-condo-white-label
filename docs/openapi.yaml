components:
  securitySchemes:
    SessionBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "opaque access token"
      description: "Access token from POST /api/v1/auth/login or /otp/confirm. Refresh via /auth/refresh. Tokens are not JWTs."
    IntegrationBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "opaque integration token"
      description: "Dedicated credential from /locations/{locationId}/integrations. Accepted only by /locker-events; human session tokens are rejected."
  parameters:
    Offset:
      name: "offset"
      in: "query"
      schema: {"type":"integer","minimum":0,"default":0}
    Limit:
      name: "limit"
      in: "query"
      schema: {"type":"integer","minimum":1,"maximum":200,"default":50}
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema: {"type":"string","minLength":1,"maxLength":128}
      description: "Stable caller-chosen key for one logical operation. Package and reservation retries with identical payload return the original resource. A changed payload conflicts. Invitation retries return 409 because credentials are returned once."
  responses:
    Error:
      description: "Structured API failure: 400 invalid input, 401 invalid or expired credentials, 403 denied permission/feature or verification_required, 404 missing or inaccessible resource, 409 conflicting state, 413 body too large, 415 unsupported media type, 429 rate limit, 500 unexpected failure, or 501 unavailable provider. X-Request-ID identifies the request."
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/ApiError"}
  schemas:
    Accepted:
      type: "object"
      additionalProperties: false
      properties:
        accepted: {"type":"boolean","default":true}
    AccountState:
      type: "object"
      additionalProperties: false
      properties:
        active: {"type":"boolean"}
      required: ["active"]
    AccountSummary:
      type: "object"
      additionalProperties: false
      properties:
        id: {"type":"string"}
        email: {"type":"string"}
        name: {"type":"string"}
        active: {"type":"boolean"}
      required: ["id","email","name","active"]
    AccountSummaryPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/AccountSummary"}
    Acknowledgment:
      type: "object"
      additionalProperties: false
      properties:
        resourceId: {"type":"string"}
        acknowledgedAt: {"type":"string","format":"date-time"}
      required: ["resourceId"]
    AcknowledgmentRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
          properties:
            data: {"$ref":"#/components/schemas/Acknowledgment"}
    AcknowledgmentRecordPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/AcknowledgmentRecord"}
    ActivationRequest:
      type: "object"
      additionalProperties: false
      properties:
        token: {"type":"string"}
        password: {"type":"string","format":"password","writeOnly":true,"minLength":12,"maxLength":256}
      required: ["token","password"]
    Announcement:
      type: "object"
      additionalProperties: false
      properties:
        content: {"$ref":"#/components/schemas/AnnouncementInput"}
        archived: {"type":"boolean","default":false}
      required: ["content"]
    AnnouncementInput:
      type: "object"
      additionalProperties: false
      properties:
        title: {"type":"string","minLength":1,"maxLength":160}
        message: {"type":"string","minLength":1,"maxLength":10000}
        unitId:
          type: ["string","null"]
          default: null
        publishAt:
          type: ["string","null"]
          default: null
          format: "date-time"
        expiresAt:
          type: ["string","null"]
          default: null
          format: "date-time"
        pinned: {"type":"boolean","default":false}
        priority:
          type: "string"
          default: "normal"
          enum: ["normal","high","urgent"]
        attachments:
          type: "array"
          items: {"type":"string","format":"uri"}
          default: []
          maxItems: 10
        acknowledgmentRequired: {"type":"boolean","default":false}
      required: ["title","message"]
    AnnouncementRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
          properties:
            data: {"$ref":"#/components/schemas/Announcement"}
    AnnouncementRecordPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/AnnouncementRecord"}
    ApiError:
      type: "object"
      properties:
        code: {"type":"string"}
        message: {"type":"string"}
        requestId:
          type: ["string","null"]
      required: ["code","message","requestId"]
    AttachmentInput:
      type: "object"
      additionalProperties: false
      properties:
        filename: {"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9._ -]{0,119}$"}
        contentType:
          type: "string"
          enum: ["image/png","image/jpeg","application/pdf"]
        contentBase64:
          type: "string"
          contentEncoding: "base64"
          maxLength: 2796204
          description: "Base64-encoded PNG, JPEG, or PDF, 1 byte to 2 MiB decoded. Signature and extension must match."
        visibility:
          type: "string"
          default: "private"
          enum: ["private","location"]
      required: ["filename","contentType","contentBase64"]
    AttachmentView:
      type: "object"
      additionalProperties: false
      properties:
        id: {"type":"string"}
        filename: {"type":"string"}
        contentType: {"type":"string"}
        size: {"type":"integer","format":"int32"}
        sha256: {"type":"string"}
        downloadPath: {"type":"string"}
      required: ["id","filename","contentType","size","sha256","downloadPath"]
    Attendance:
      type: "object"
      additionalProperties: false
      properties:
        eventId: {"type":"string"}
      required: ["eventId"]
    AttendanceRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
          properties:
            data: {"$ref":"#/components/schemas/Attendance"}
    AttendanceRecordPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/AttendanceRecord"}
    AvailabilitySlot:
      type: "object"
      additionalProperties: false
      properties:
        startsAt: {"type":"string","format":"date-time"}
        endsAt: {"type":"string","format":"date-time"}
      required: ["startsAt","endsAt"]
    Brand:
      type: "object"
      additionalProperties: false
      properties:
        name: {"type":"string"}
        application:
          type: "string"
          enum: ["smartlocker","condo"]
        primaryColor: {"type":"string","default":"#2563EB","pattern":"^#[0-9A-Fa-f]{6}$"}
        logoUrl:
          type: ["string","null"]
          default: null
        supportEmail:
          type: ["string","null"]
          default: null
        features:
          type: "array"
          items:
            type: "string"
            enum:
              - "packages"
              - "reservations"
              - "announcements"
              - "events"
              - "pets"
              - "requests"
              - "visitors"
              - "vehicles"
              - "maintenance"
              - "documents"
              - "cameras"
              - "notifications"
              - "contacts"
          uniqueItems: true
          default:
            - "packages"
            - "reservations"
            - "announcements"
            - "events"
            - "pets"
            - "requests"
            - "visitors"
            - "vehicles"
            - "maintenance"
            - "documents"
            - "cameras"
            - "notifications"
            - "contacts"
      required: ["name","application"]
    BrandRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
          properties:
            data: {"$ref":"#/components/schemas/Brand"}
    BrandRecordPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/BrandRecord"}
    CameraInput:
      type: "object"
      additionalProperties: false
      properties:
        name: {"type":"string"}
        area: {"type":"string"}
        enabled: {"type":"boolean","default":true}
        unitId:
          type: ["string","null"]
          default: null
      required: ["name","area"]
    CameraInputRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
          properties:
            data: {"$ref":"#/components/schemas/CameraInput"}
    CameraInputRecordPage:
      allOf:
        - {"$ref":"#/components/schemas/Page"}
        -
          type: "object"
          properties:
            items:
              type: "array"
              items: {"$ref":"#/components/schemas/CameraInputRecord"}
    ClientSettings:
      type: "object"
      additionalProperties: false
      properties:
        name: {"type":"string"}
        active:
          type: "boolean"
          default: true
          const: true
          description: "Self-service updates keep the client active. Operators use the client-state command to suspend or restore clients."
        features:
          type: "array"
          items:
            type: "string"
            enum:
              - "packages"
              - "reservations"
              - "announcements"
              - "events"
              - "pets"
              - "requests"
              - "visitors"
              - "vehicles"
              - "maintenance"
              - "documents"
              - "cameras"
              - "notifications"
              - "contacts"
          uniqueItems: true
          default:
            - "packages"
            - "reservations"
            - "announcements"
            - "events"
            - "pets"
            - "requests"
            - "visitors"
            - "vehicles"
            - "maintenance"
            - "documents"
            - "cameras"
            - "notifications"
            - "contacts"
        supportEmail:
          type: ["string","null"]
          default: null
        passwordLogin: {"type":"boolean","default":true}
        otpLogin: {"type":"boolean","default":false}
      required: ["name"]
    ClientSettingsRecord:
      allOf:
        - {"$ref":"#/components/schemas/Record"}
        -
          type: "object"
