# OpenAPI contract for the implemented HTTP routes.
# Update this file when route methods, paths, or DTOs change.
openapi: "3.1.0"
info:
  title: "Community API"
  version: "0.1.0"
  description: "Kotlin/Ktor API for white-label condo and smart locker applications. IDs are opaque strings. Human sessions select a tenant at sign-in; branding never grants access. Protected operations enforce active membership, enabled features, action permissions, and resource ownership. ISO timestamps use an explicit UTC offset. JSON request bodies reject unknown properties. The request body limit is 3 MiB. Permissions listed in descriptions are additional to authentication. See docs/identity.md, docs/deliveries.md, docs/reservations.md, and docs/community.md for workflow rules."
servers:
  - {"url":"http://localhost:8080","description":"Local development"}
security:
  -
    SessionBearer: []
paths:
  "/health/live":
    get:
      tags: ["Health"]
      summary: "Check liveness"
      operationId: "get_health_live"
      security: []
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
        default: {"$ref":"#/components/responses/Error"}
  "/health/ready":
    get:
      tags: ["Health"]
      summary: "Check database readiness"
      operationId: "get_health_ready"
      security: []
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
        default: {"$ref":"#/components/responses/Error"}
        "503":
          description: "Database is not ready."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/HealthResponse"}
  "/api/v1/auth/login":
    post:
      tags: ["Identity"]
      summary: "Sign in with a password"
      operationId: "post_api_v1_auth_login"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/refresh":
    post:
      tags: ["Identity"]
      summary: "Rotate access and refresh tokens"
      operationId: "post_api_v1_auth_refresh"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/RefreshRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/activate":
    post:
      tags: ["Identity"]
      summary: "Activate an invited account"
      operationId: "post_api_v1_auth_activate"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ActivationRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/recovery/request":
    post:
      tags: ["Identity"]
      summary: "Request password recovery"
      operationId: "post_api_v1_auth_recovery_request"
      description: "Requests are rate limited. Recovery and code request responses do not reveal whether the account exists."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/EmailRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/recovery/confirm":
    post:
      tags: ["Identity"]
      summary: "Reset password using a recovery token"
      operationId: "post_api_v1_auth_recovery_confirm"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ActivationRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/otp/request":
    post:
      tags: ["Identity"]
      summary: "Request an email sign-in code"
      operationId: "post_api_v1_auth_otp_request"
      description: "Requests are rate limited. Recovery and code request responses do not reveal whether the account exists."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/EmailRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/otp/confirm":
    post:
      tags: ["Identity"]
      summary: "Sign in with a one-time email code"
      operationId: "post_api_v1_auth_otp_confirm"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/OtpRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Tokens"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/auth/logout":
    post:
      tags: ["Identity"]
      summary: "Revoke the current session"
      operationId: "post_api_v1_auth_logout"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Accepted"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me":
    get:
      tags: ["Identity"]
      summary: "Read your profile"
      operationId: "get_api_v1_me"
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        default: {"$ref":"#/components/responses/Error"}
    patch:
      tags: ["Identity"]
      summary: "Update your display name"
      operationId: "patch_api_v1_me"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ProfileRequest"}
      responses:
        "200":
          description: "Successful operation."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        default: {"$ref":"#/components/responses/Error"}
  "/api/v1/me/verify":
    post:
      tags: ["Identity"]
      summary: "Verify your password for sensitive operations"
      operationId: "post_api_v1_me_verify"
      requestBody:
        required: true
        content:
