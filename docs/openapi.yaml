          - device.power_lost
          - device.power_restored
          - device.went_offline
          - device.came_online
          - device.firmware_updated
          - device.clock_drift_detected
          description: Catálogo fechado. app.* só com SessionBearer, web.* só com StaffBearer, device.* só com DeviceKey
            (403 por evento se não bater).
        occurredAt:
          $ref: '#/components/schemas/Instant'
          description: Momento em que aconteceu, com milissegundos. Faz parte da impressão digital usada para descartar
            reenvios.
        contextId:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
          description: 'Opcional. O Context.id de GET /me/contexts em uso (vínculo de morador ou atribuição de equipe).
            Omitir quando não há contexto (conta sem vínculo, tela de perfil). Se omitido e houver target, o servidor
            resolve o contexto que dá acesso ao objeto. O condomínio nunca é informado pelo cliente: sai do contexto
            ou do target.'
        target:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - type
            - id
            properties:
              type:
                type: string
                enum:
                - parcel
                - camera
                - recording
                - access_invite
                - membership
                - export
                - report
                - locker
                - compartment
                - gate
                - device
              id:
                $ref: '#/components/schemas/Identifier'
          - type: 'null'
          description: Opcional. O servidor valida que o ator tem acesso ao objeto e que o tipo combina com o evento
            (camera_view_* → camera; recording_played → recording; pickup_code_displayed → parcel; access_qr_* →
            access_invite; export_downloaded → export; device.* → locker/gate/device). Incompatível → rejected target_mismatch.
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Só em camera_view_ended e recording_played; nos demais deve ser omitido.
        details:
          type: object
          maxProperties: 20
          description: Até 4 KB. Sem PII, sem segredos (rejeitado se detectado).
      required:
      - type
      - occurredAt
      examples:
      - type: app.camera_view_ended
        occurredAt: '2026-09-26T12:04:10.482Z'
        contextId: mem_7Qk2
        target:
          type: camera
          id: cam_Garagem01
        durationSeconds: 250
      - type: app.screenshot_detected
        occurredAt: '2026-09-26T12:05:00.117Z'
      - type: device.door_forced
        occurredAt: '2026-09-26T03:12:44.903Z'
        target:
          type: gate
          id: gate_Garagem
        details:
          sensor: reed_2
