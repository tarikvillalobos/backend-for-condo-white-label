name: Build and verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: community_test
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community -d community_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Check commit limits
        run: python3 scripts/check_commits.py
      - name: Build and test against H2 and PostgreSQL
        run: ./gradlew --no-daemon build installDist
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/community_test
